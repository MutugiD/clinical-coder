[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-scribe"
version = "0.1.0"
description = "Grounded clinical extraction and deterministic resolution"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
scribe = "clinical_scribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["clinical_scribe*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
