name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q src
      - run: ./scribe --version
  container:
    runs-on: ubuntu-latest
    env:
      SCRIBE_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker run --rm clinical-scribe:local --version
      - run: docker compose up -d --wait --wait-timeout 90
      - run: python src/tests/compose_smoke.py
      - if: always()
        run: docker compose down
